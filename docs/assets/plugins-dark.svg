<title id="t">Die 30 Plugins von NetScope</title>
<desc id="d">Scanner: arpscan, icmp, oui, dns, mdns, netbios, upnp, nmap, nmap_udp, http, tls, snmp, ssh, wol. Importer: proxmox, openwrt, docker, netalertx, csv. Processor: diff, cve, healthcheck, topology, cleanup, report. Publisher: telegram, webhook, ntfy, email, n8n</desc>
