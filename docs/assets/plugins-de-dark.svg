<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="334" viewBox="0 0 1100 334" role="img" aria-labelledby="t d">
<title id="t">Die 41 Plugins von NetScope</title>
<desc id="d">Scanner: arpscan, icmp, oui, dns, mdns, netbios, upnp, nmap, nmap_udp, http, tls, snmp, snmp_traffic, ssh, wol. Importer: agent, proxmox, openwrt, opnsense, pfsense, unifi, mikrotik, fortigate, sophos, meraki, fritzbox, pihole, docker, netalertx, csv. Processor: diff, cve, healthcheck, topology, cleanup, report. Publisher: telegram, webhook, ntfy, email, n8n</desc>
